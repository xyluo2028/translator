[project]
name = "llm-translator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
# Offline language detection, spelling correction ("did you mean"), and Japanese furigana.
text = [
  "fugashi>=1.3.0",
  "lingua-language-detector>=2.1,<3",
  "pyspellchecker>=0.8.0",
  "unidic-lite>=1.0.8",
]
transformers = [
  "accelerate>=1.5.0",
  "pillow>=10.0.0",
  "sentencepiece>=0.2.0",
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "transformers>=4.57.0",
]
# Add alongside the transformers extra for quantized NVIDIA inference.
cuda = ["bitsandbytes>=0.49.0"]

[tool]
# No tooling configured yet; keep MVP dependency-free.
