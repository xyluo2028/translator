# Copy to config.toml and customize locally. Runtime configs are ignored by Git.
[provider]
# "ollama", "transformers", "gemini", or "openai". The web UI can pick per request.
name = "ollama"

[ollama]
host = "http://localhost:11434"
model = "hf.co/tencent/HY-MT1.5-7B-GGUF:Q4_K_M"
# General model for dictionary, tone, Relatives, and Enhance.
dictionary_model = "gpt-oss:latest"

[transformers]
model = "tencent/HY-MT1.5-7B"
dictionary_model = "google/gemma-4-E4B-it"
models = ["tencent/HY-MT1.5-1.8B", "google/translategemma-4b-it"]
# Automatic placement supports Apple Silicon (MPS), NVIDIA (CUDA), or CPU.
device_map = "auto"
dtype = "auto"
quantization = "none"
attn_implementation = "auto"
max_cached_models = 2
max_new_tokens = 512
enable_thinking = false
trust_remote_code = false

[defaults]
source_lang = "auto"
target_lang = "ZH"
tone = "neutral"
explain_lang = "EN"
temperature = 0.2

[enhancement]
num_ctx = 8192
max_new_tokens = 2048

# Credentials are read from the server/CLI environment, never this file.
[openai]
model = "gpt-6-luna"
api_key_env = "OPENAI_API_KEY"
models = []
reasoning_effort = "none"
max_output_tokens = 4096
timeout_s = 120

[gemini]
model = "gemini-3.1-flash-lite"
api_key_env = "GEMINI_API_KEY"
models = []
reasoning_effort = "minimal"
max_output_tokens = 4096
timeout_s = 120
