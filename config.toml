[provider]
# Default backend: "ollama", "transformers", "gemini", or "openai". The web UI can pick per request.
name = "transformers"

[ollama]
host = "http://localhost:11434"
# Translation model. Translation-only models are detected by name and prompted in their own format:
#   "hf.co/tencent/HY-MT1.5-7B-GGUF:Q4_K_M"  (Hunyuan MT, `ollama pull hf.co/tencent/HY-MT1.5-7B-GGUF:Q4_K_M`)
#   "translategemma:12b"                      (TranslateGemma, `ollama pull translategemma:12b`)
# Any general chat model (e.g. "gpt-oss:latest") also works and supports tone/notes/alternatives.
model = "hf.co/tencent/HY-MT1.5-7B-GGUF:Q4_K_M"
# General chat model used for dictionary mode and tone when `model` is translation-only.
dictionary_model = "gpt-oss:latest"

[transformers]
# Local Hugging Face models. Setup: `python3 -m venv .venv && .venv/bin/pip install -e '.[transformers]'`,
# run the app with .venv/bin/python, and download weights first, e.g. `.venv/bin/hf download tencent/HY-MT1.5-7B`.
model = "tencent/HY-MT1.5-7B"
# General model used for dictionary mode and tone when `model` is translation-only.
dictionary_model = "google/gemma-4-E4B-it"
# Extra models listed in the web UI. TranslateGemma is gated: accept its license on huggingface.co, then `hf auth login`.
models = ["tencent/HY-MT1.5-1.8B", "google/translategemma-4b-it"]
# RTX 4080 (16 GB): quantize weights and keep the complete model on CUDA.
# Use device_map/dtype = "auto" and quantization = "none" on non-CUDA machines.
device_map = "cuda"
dtype = "bfloat16"
quantization = "4bit"
attn_implementation = "sdpa"
# Switching models reloads weights, but avoids retaining the 7B translator alongside Gemma.
max_cached_models = 1
max_new_tokens = 512
enable_thinking = false
trust_remote_code = false

[defaults]
source_lang = "auto"
target_lang = "ZH"
tone = "neutral"
explain_lang = "EN"
temperature = 0.2

# Optional cloud backends. Keys are read from the server/CLI environment, never this file.
# Select in the web UI or pass --provider gemini / --provider openai to translate.py.
[openai]
model = "gpt-6-luna"
api_key_env = "OPENAI_API_KEY"
models = []
reasoning_effort = "none"
max_output_tokens = 4096
timeout_s = 120

[gemini]
model = "gemini-3.1-flash-lite"
api_key_env = "GEMINI_API_KEY"
models = []
reasoning_effort = "minimal"
max_output_tokens = 4096
timeout_s = 120
